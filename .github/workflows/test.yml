  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: ${{ !(github.event.pull_request.draft || false) }}
    container: swiftlang/swift:nightly-6.4.x-bookworm
    steps:
      - name: Install curl/bash for action-checkout (racecar; ungated, both arms)
        shell: sh
        # Best-effort probe, never a gate. Inside a container job running as a
        # non-root user, apt-get cannot write /var/lib/apt/lists and exits 100,
        # which failed ardupilot's build job at step 3 before any of its own work
        # ran. GitHub uses `sh -e`, so a failing command aborts the script and a
        # trailing `exit 0` would never be reached -- hence `|| true` per branch
        # plus continue-on-error. If curl/bash are genuinely missing,
        # action-checkout fails next with a message that names the real problem.
        continue-on-error: true
        run: |
          command -v curl >/dev/null 2>&1 && command -v bash >/dev/null 2>&1 && exit 0
          SUDO=
          if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1; then SUDO=sudo; fi
          if command -v apt-get >/dev/null 2>&1; then
            { $SUDO apt-get update -qq && DEBIAN_FRONTEND=noninteractive $SUDO apt-get install -y -qq curl ca-certificates bash; } || true
          elif command -v apk >/dev/null 2>&1; then $SUDO apk add --no-cache curl ca-certificates bash || true
          elif command -v dnf >/dev/null 2>&1; then $SUDO dnf install -y curl ca-certificates bash || true
          elif command -v yum >/dev/null 2>&1; then $SUDO yum install -y curl ca-certificates bash || true
          elif command -v zypper >/dev/null 2>&1; then $SUDO zypper -n install curl ca-certificates bash || true
          fi
          exit 0

      - name: Check out Vapor
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - name: Run tests
        run: swift test

  package-traits:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: ${{ !(github.event.pull_request.draft || false) }}
    container: swiftlang/swift:nightly-6.4.x-bookworm
    steps:
      - name: Install curl/bash for action-checkout (racecar; ungated, both arms)
        shell: sh
        # Best-effort probe, never a gate. Inside a container job running as a
        # non-root user, apt-get cannot write /var/lib/apt/lists and exits 100,
        # which failed ardupilot's build job at step 3 before any of its own work
        # ran. GitHub uses `sh -e`, so a failing command aborts the script and a
        # trailing `exit 0` would never be reached -- hence `|| true` per branch
        # plus continue-on-error. If curl/bash are genuinely missing,
        # action-checkout fails next with a message that names the real problem.
        continue-on-error: true
        run: |
          command -v curl >/dev/null 2>&1 && command -v bash >/dev/null 2>&1 && exit 0
          SUDO=
          if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1; then SUDO=sudo; fi
          if command -v apt-get >/dev/null 2>&1; then
            { $SUDO apt-get update -qq && DEBIAN_FRONTEND=noninteractive $SUDO apt-get install -y -qq curl ca-certificates bash; } || true
          elif command -v apk >/dev/null 2>&1; then $SUDO apk add --no-cache curl ca-certificates bash || true
          elif command -v dnf >/dev/null 2>&1; then $SUDO dnf install -y curl ca-certificates bash || true
          elif command -v yum >/dev/null 2>&1; then $SUDO yum install -y curl ca-certificates bash || true
          elif command -v zypper >/dev/null 2>&1; then $SUDO zypper -n install curl ca-certificates bash || true
          fi
          exit 0

      - name: Check out Vapor
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - name: Run tests with traits disabled
        run: swift test --disable-default-traits

  performance-harness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: ${{ !(github.event.pull_request.draft || false) }}
    container: swiftlang/swift:nightly-6.4.x-bookworm
    steps:
      - name: Install curl/bash for action-checkout (racecar; ungated, both arms)
        shell: sh
        # Best-effort probe, never a gate. Inside a container job running as a
        # non-root user, apt-get cannot write /var/lib/apt/lists and exits 100,
        # which failed ardupilot's build job at step 3 before any of its own work
        # ran. GitHub uses `sh -e`, so a failing command aborts the script and a
        # trailing `exit 0` would never be reached -- hence `|| true` per branch
        # plus continue-on-error. If curl/bash are genuinely missing,
        # action-checkout fails next with a message that names the real problem.
        continue-on-error: true
        run: |
          command -v curl >/dev/null 2>&1 && command -v bash >/dev/null 2>&1 && exit 0
          SUDO=
          if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1; then SUDO=sudo; fi
          if command -v apt-get >/dev/null 2>&1; then
            { $SUDO apt-get update -qq && DEBIAN_FRONTEND=noninteractive $SUDO apt-get install -y -qq curl ca-certificates bash; } || true
          elif command -v apk >/dev/null 2>&1; then $SUDO apk add --no-cache curl ca-certificates bash || true
          elif command -v dnf >/dev/null 2>&1; then $SUDO dnf install -y curl ca-certificates bash || true
          elif command -v yum >/dev/null 2>&1; then $SUDO yum install -y curl ca-certificates bash || true
          elif command -v zypper >/dev/null 2>&1; then $SUDO zypper -n install curl ca-certificates bash || true
          fi
          exit 0

      - name: Check out Vapor
        uses: crashappsec/action-checkout@main
      # Just build for now to make sure it actually compiles
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - name: Build the performance harness
        run: swift build --package-path Performance

  submit-dependencies:
    permissions:
      contents: write
      id-token: write
    # Upstream gates this to push events. The harness patch rewrote that guard
    # to the tautology `'push' == 'push'`, which armed a `contents: write`
    # dependency-snapshot submission on every workflow_dispatch -- a write we
    # must not make from a fork, and one that fails anyway because the
    # submission container's toolchain is older than Package.swift's
    # swift-tools-version (see foundation-linking note). Guard restored.
    if: ${{ github.event_name == 'push' }}
    uses: vapor/ci/.github/workflows/submit-deps.yml@main
    secrets: inherit

  foundation-linking:
    # Red on upstream vapor/vapor itself, same step, same three lines:
    #   ** ERROR: libFoundation.so found. / libFoundationInternationalization.so
    #   / lib_FoundationICU.so  ->  ** ERROR: At least one Foundation lib was found.
    # (upstream push-to-main run 33671549967, 2026-09-02, and every test.yml run
    # since). The check lives in vapor/ci, not here, and `continue-on-error` is
    # not a legal key on a job that calls a reusable workflow -- so gating the
    # job off on forks is the only way to keep this fork's baseline honest.
    # Costs the release-mode link check; unit-tests, package-traits and
    # performance-harness still carry the real build/test work.
    if: ${{ github.repository == 'vapor/vapor' }}
    uses: vapor/ci/.github/workflows/check-foundation-linking.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      swift_image: swiftlang/swift:nightly-6.4.x-bookworm
      excluded_products: 'VaporTesting'
