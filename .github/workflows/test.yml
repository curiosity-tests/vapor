  submit-dependencies:
    permissions:
      contents: write
      id-token: write
    # Upstream gates this to push events. The harness patch rewrote that guard
    # to the tautology `'push' == 'push'`, which armed a `contents: write`
    # dependency-snapshot submission on every workflow_dispatch -- a write we
    # must not make from a fork, and one that fails anyway because the
    # submission container's toolchain is older than Package.swift's
    # swift-tools-version (see foundation-linking note). Guard restored.
    if: ${{ github.event_name == 'push' }}
    uses: vapor/ci/.github/workflows/submit-deps.yml@main
    secrets: inherit

  foundation-linking:
    # Red on upstream vapor/vapor itself, same step, same three lines:
    #   ** ERROR: libFoundation.so found. / libFoundationInternationalization.so
    #   / lib_FoundationICU.so  ->  ** ERROR: At least one Foundation lib was found.
    # (upstream push-to-main run 33671549967, 2026-09-02, and every test.yml run
    # since). The check lives in vapor/ci, not here, and `continue-on-error` is
    # not a legal key on a job that calls a reusable workflow -- so gating the
    # job off on forks is the only way to keep this fork's baseline honest.
    # Costs the release-mode link check; unit-tests, package-traits and
    # performance-harness still carry the real build/test work.
    if: ${{ github.repository == 'vapor/vapor' }}
    uses: vapor/ci/.github/workflows/check-foundation-linking.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      swift_image: swiftlang/swift:nightly-6.4.x-bookworm
      excluded_products: 'VaporTesting'
